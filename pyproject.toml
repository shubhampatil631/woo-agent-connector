[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "woo-connector"
version = "0.1.0"
description = "Private WooCommerce connector for Razorpay Agent Studio"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Razorpay Agent Studio Team" }
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "mcp>=1.2.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "faker>=24.0.0",
    "fastapi>=0.110.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "ruff>=0.3.0",
]

[project.scripts]
woo-mcp = "woo_connector.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/woo_connector"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["woo_connector"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
